project:
  type: book
  output-dir: _book
  preview:
    port: 4321
    browser: false

book:
  title: "The Evidence Behind"
  subtitle: "What we actually know about looking after your teeth"
  author: "Ahmad Sofi-Mahmudi"
  date: last-modified
  date-format: "D MMMM YYYY"
  language: en-GB
  search: true
  reader-mode: true
  # repo-url and repo-actions are disabled while the repository is private:
  # they render "Edit this page" and "Report an issue" links in the sidebar,
  # and both 404 for a reader who is not signed in as the owner. Restore both
  # when the repo is made public on completion of the manuscript.
  # repo-url: https://github.com/choxos/OralHealthBook
  # repo-actions: [issue, source]
  sharing: [twitter, linkedin]
  # NO `downloads:` here. The PDF and EPUB are the paid Amazon edition;
  # offering them from the free site would both give away the artifact and,
  # since the web profile renders html only, link to files that are not there.
  # The free site is the full body text. The paid edition adds the appendices.
  page-footer:
    left: "© 2026 Ahmad Sofi-Mahmudi. CC BY-NC-ND 4.0."
    right: "Built with [Quarto](https://quarto.org)."

  chapters:
    - index.qmd

    - part: "Part I. How to read a recommendation"
      chapters:
        - parts/01-method/01-why-audit.qmd
        - parts/01-method/02-certainty-is-not-strength.qmd
        - parts/01-method/03-the-bundling-problem.qmd
        - parts/01-method/04-how-i-did-this.qmd

    - part: "Part II. Caries, brushing and fluoride"
      chapters:
        - parts/02-caries/05-brush-twice-daily.qmd
        - parts/02-caries/06-last-thing-at-night.qmd
        - parts/02-caries/07-spit-dont-rinse.qmd
        - parts/02-caries/08-how-much-fluoride.qmd
        - parts/02-caries/09-how-much-toothpaste.qmd
        - parts/02-caries/10-fluoride-varnish.qmd
        - parts/02-caries/11-fissure-sealants.qmd
        - parts/02-caries/12-fluoride-mouth-rinse.qmd
        - parts/02-caries/13-sugar.qmd
        - parts/02-caries/14-breastfeeding.qmd
        - parts/02-caries/15-the-quieter-tier.qmd

    - part: "Part III. Gums, plaque and the spaces between"
      chapters:
        - parts/03-gums/16-manual-or-powered.qmd
        - parts/03-gums/17-flossing.qmd
        - parts/03-gums/18-toothbrush-design.qmd
        - parts/03-gums/19-scale-and-polish.qmd

    - part: "Part IV. Cancer, tobacco, alcohol and wear"
      chapters:
        - parts/04-cancer-wear/20-oral-cancer-screening.qmd
        - parts/04-cancer-wear/21-tobacco.qmd
        - parts/04-cancer-wear/22-alcohol.qmd
        - parts/04-cancer-wear/23-tooth-wear.qmd

    - part: "Part V. The questions people actually ask"
      chapters:
        - parts/05-questions/24-fluoridation-does-it-work.qmd
        - parts/05-questions/25-fluoridation-is-it-harmful.qmd
        - parts/05-questions/26-filling-childrens-teeth.qmd
        - parts/05-questions/27-bad-breath.qmd
        - parts/05-questions/28-six-month-checkup.qmd
        - parts/05-questions/29-the-toothpaste-aisle.qmd
        - parts/05-questions/30-short-answers.qmd

    - part: "Part VI. What to do anyway"
      chapters:
        - parts/06-anyway/31-what-i-actually-do.qmd
        - parts/06-anyway/32-how-research-should-change.qmd

    - references.qmd

  # Appendices are the paid edition's apparatus and are declared in
  # _quarto-print.yml only. The web profile excludes them from the
  # render set entirely; chapters link to appraisals/ on GitHub instead.

bibliography: bibliography/refs.bib
csl: _assets/csl/vancouver.csl
citations-hover: true
link-citations: true

crossref:
  chapters: true

execute:
  freeze: auto
  echo: false
  warning: false
  message: false

knitr:
  opts_chunk:
    dev: "ragg_png"
    dpi: 300
    fig.align: center
