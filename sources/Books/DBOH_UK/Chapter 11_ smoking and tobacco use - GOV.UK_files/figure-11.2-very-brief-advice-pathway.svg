<svg width="720" height="1280" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" overflow="hidden"><g><rect x="0" y="0" width="720" height="1280" fill="#FFFFFF"/><text fill="#0B0C0C" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="24" transform="translate(75.3099 40)">Very Brief Advice Pathway: 30 Second Discussion</text><path d="M30.5001 108.835C30.5001 84.9016 49.9016 65.5001 73.8346 65.5001L647.166 65.5001C671.099 65.5001 690.5 84.9016 690.5 108.835L690.5 282.165C690.5 306.099 671.099 325.5 647.166 325.5L73.8346 325.5C49.9016 325.5 30.5001 306.099 30.5001 282.165Z" stroke="#34B6E4" stroke-width="1.33333" stroke-miterlimit="8" fill="#D6F0FA" fill-rule="evenodd"/><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="21.3333" transform="translate(326.92 99)">ASK…</text><text fill="#0063BE" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="21.3333" transform="translate(85.38 124)">All patients</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21.3333" transform="translate(206.547 124)">about tobacco use, as part of medical history.</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="18.6667" transform="translate(289.167 170)">“Do you smoke?”</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="18.6667" transform="translate(56.9999 192)">“Do you use tobacco products, for example snuff, paan, chewing tobacco,</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="18.6667" transform="translate(314 215)">or shisha?”</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="18.6667" transform="translate(139.253 237)">“Have you ever smoked or used tobacco in the past?”</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="18.6667" transform="translate(271.587 259)">“When did you stop?”</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="21.3333" transform="translate(187.42 307)">Recheck and record at every visit.</text><path d="M30.5001 366.167C30.5001 350.335 43.3348 337.5 59.1672 337.5L661.833 337.5C677.665 337.5 690.5 350.335 690.5 366.167L690.5 480.833C690.5 496.665 677.665 509.5 661.833 509.5L59.1672 509.5C43.3348 509.5 30.5001 496.665 30.5001 480.833Z" stroke="#34B6E4" stroke-width="1.33333" stroke-miterlimit="8" fill="#D6F0FA" fill-rule="evenodd"/><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="21.3333" transform="translate(300.83 380)">EXAMINE…</text><text fill="#0063BE" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="21.3333" transform="translate(86.4166 405)">All patients</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21.3333" transform="translate(201.583 405)">, and record signs of tobacco use for example</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21.3333" transform="translate(88.5833 431)">staining, halitosis, mucosal changes. Conduct oral cancer</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21.3333" transform="translate(62.9166 457)">screening, basic periodontal examination (BPE), monitor / refer</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21.3333" transform="translate(323.917 482)">lesions.</text><path d="M30.5001 635.168C30.5001 613.812 47.8121 596.5 69.1675 596.5L651.833 596.5C673.188 596.5 690.5 613.812 690.5 635.168L690.5 789.833C690.5 811.188 673.188 828.5 651.833 828.5L69.1675 828.5C47.8121 828.5 30.5001 811.188 30.5001 789.833Z" stroke="#34B6E4" stroke-width="1.33333" stroke-miterlimit="8" fill="#D6F0FA" fill-rule="evenodd"/><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="21.3333" transform="translate(309.753 621)">ADVISE…</text><text fill="#0063BE" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="21.3333" transform="translate(69.2533 646)">Those at risk</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21.3333" transform="translate(206.92 646)">on method of quitting. Don’t ask patients if they</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21.3333" transform="translate(93.4533 672)">want</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21.3333" transform="translate(144.453 672)">to quit</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21.3333" transform="translate(208.62 672)">–</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21.3333" transform="translate(226.453 672)">this leads to defensiveness. Avoid detailed</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21.3333" transform="translate(69.42 698)">questions. Give brief information on ways of stopping tobacco</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21.3333" transform="translate(339.833 723)">use.</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="18.6667" transform="translate(62.5 775)">“Research shows the best way to stop is with a combination of specialist</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="18.6667" transform="translate(76.7667 797)">support and medication. You are up to four times as likely to quit with</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="18.6667" transform="translate(173.92 820)">assistance. I can help arrange</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="18.6667" transform="translate(427.253 820)">both of these</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="18.6667" transform="translate(534.753 820)">.”</text><path d="M30.5001 909.501C30.5001 871.393 61.3929 840.5 99.5012 840.5L621.499 840.5C659.607 840.5 690.5 871.393 690.5 909.501L690.5 1185.5C690.5 1223.61 659.607 1254.5 621.499 1254.5L99.5012 1254.5C61.3929 1254.5 30.5001 1223.61 30.5001 1185.5Z" stroke="#34B6E4" stroke-width="1.33333" stroke-miterlimit="8" fill="#D6F0FA" fill-rule="evenodd"/><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="21.3333" transform="translate(327.497 886)">ACT…</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="21.3333" transform="translate(246.917 911)">Depending on response</text><path d="M234.5 521.5 234.5 556.5 246.5 556.5 222.5 580.5 198.5 556.5 210.5 556.5 210.5 521.5Z" stroke="#34B6E4" stroke-width="1.33333" stroke-miterlimit="8" fill="#34B6E4" fill-rule="evenodd"/><text fill="#0063BE" font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="24" transform="translate(256.667 555)">For those at risk</text><path d="M46.5001 982.168C46.5001 954.185 69.1847 931.5 97.1676 931.5L299.833 931.5C327.815 931.5 350.5 954.185 350.5 982.168L350.5 1194.83C350.5 1222.82 327.815 1245.5 299.833 1245.5L97.1676 1245.5C69.1847 1245.5 46.5001 1222.82 46.5001 1194.83Z" stroke="#92D050" stroke-width="1.33333" stroke-miterlimit="8" fill="#92D050" fill-rule="evenodd"/><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="translate(138.833 959)">INTERESTED</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="18.6667" transform="translate(73.3333 988)">Acknowledge that e</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="18.6667" transform="translate(235.833 988)">-</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="18.6667" transform="translate(242 988)">cigarettes</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="18.6667" transform="translate(73.9133 1010)">are shown to help people stop</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="18.6667" transform="translate(160.747 1033)">smoking.</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="18.6667" transform="translate(110.58 1062)">Recommend nicotine</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="18.6667" transform="translate(89.9999 1084)">replacement therapies, for</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="18.6667" transform="translate(97.1666 1106)">example patches, gums,</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="18.6667" transform="translate(162.833 1129)">inhalers.</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="18.6667" transform="translate(95.0799 1158)">Refer or signpost to local</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="18.6667" transform="translate(96.6666 1180)">resources (stop smoking</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="18.6667" transform="translate(95.7866 1202)">support, GP, pharmacist)</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="18.6667" transform="translate(91.4133 1231)">Record in clinical records.</text><path d="M368.5 982.168C368.5 954.185 391.185 931.5 419.168 931.5L621.833 931.5C649.815 931.5 672.5 954.185 672.5 982.168L672.5 1194.83C672.5 1222.82 649.815 1245.5 621.833 1245.5L419.168 1245.5C391.185 1245.5 368.5 1222.82 368.5 1194.83Z" stroke="#FCC6D1" stroke-width="1.33333" stroke-miterlimit="8" fill="#FCC6D1" fill-rule="evenodd"/><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="translate(438.98 954)">NOT INTERESTED</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="18.6667" transform="translate(424.733 983)">Give the patient control</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="18.6667" transform="translate(415.487 1005)">“It’s your choice. Help will</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="18.6667" transform="translate(394.647 1028)">always be available. Do let me</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="18.6667" transform="translate(394.233 1050)">know if you change your mind”</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="18.6667" transform="translate(506.4 1073)">OR</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="18.6667" transform="translate(422.647 1095)">“If you’d like to use stop</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="18.6667" transform="translate(405.067 1117)">smoking services in future, I</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="18.6667" transform="translate(420.147 1140)">can refer you or you can</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-style="italic" font-weight="400" font-size="18.6667" transform="translate(431.98 1162)">contact them directly”</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="18.6667" transform="translate(413.813 1191)">Record in clinical records.</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="18.6667" transform="translate(416.9 1213)">Reassess on future visits</text><text font-family="Arial,Arial_MSFontService,sans-serif" font-weight="400" font-size="18.6667" transform="translate(495.48 1236)">(ASK)</text><path d="M483.5 521.5 483.5 556.5 495.5 556.5 471.5 580.5 447.5 556.5 459.5 556.5 459.5 521.5Z" stroke="#34B6E4" stroke-width="1.33333" stroke-miterlimit="8" fill="#34B6E4" fill-rule="evenodd"/></g></svg>